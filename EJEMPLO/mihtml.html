<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Básica</title>
    <link rel="stylesheet" href="micss.css">
</head>
<body>

    <div class="calculadora">
        <h1>Calculadora Básica</h1>
        
        <div class="input-group">
            <label for="op1"><u>Operando 1</u></label>
            <input type="number" id="op1" placeholder="Número 1">
        </div>

        <div class="input-group">
            <label for="op2"><u>Operando 2</u></label>
            <input type="number" id="op2" placeholder="Número 2">
        </div>

        <div class="botones">
            <button onclick="calcular('+')">+</button>
            <button onclick="calcular('-')">-</button>
            <button onclick="calcular('*')">*</button>
            <button onclick="calcular('/')">/</button>
        </div>

        <div id="resultado" class="caja-resultado">
            Introduce dos números y selecciona una operación.
        </div>
    </div>

    <script src="mijs.js"></script>
</body>
</html>
